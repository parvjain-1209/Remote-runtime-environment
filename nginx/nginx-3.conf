events {
    worker_connections 1024;
}

http {
    log_format custom '$remote_addr - "$request" $status $request_time $upstream_addr';
    access_log /dev/stdout custom;

    upstream backend_pool {
        server backend-1:10000 max_fails=3 fail_timeout=5s;
        server backend-2:10000 max_fails=3 fail_timeout=5s;
        server backend-3:10000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
